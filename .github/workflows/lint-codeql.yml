name: codeql

on:
  workflow_dispatch:
    inputs:
      PR-number:
        required: true
        type: string
        description: "Pull request number."
      context-ref:
        required: true
        type: string
        description: "Context in which the workflow runs. If the pull request is from a fork, this is the pull request target branch. Otherwise, this is the pull request branch so committers can test workflow changes directly."
      SHA:
        required: true
        type: string
        description: "SHA under test (head of the pull request branch)."
      base-SHA:
        required: true
        type: string
        description: "SHA of the base branch (target branch of the pull request)."
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  schedule:
    - cron: "45 6 * * 3"

permissions: read-all

jobs:
  commit-status-start:
    name: Commit Status Start
    if: ${{ inputs.PR-number }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Set initial commit status
        uses: cilium/tetragon/.github/actions/set-commit-status@main
        with:
          sha: ${{ inputs.SHA || github.sha }}

  check_changes:
    name: Deduce required tests from code changes
    if: ${{ inputs.PR-number }}
    needs: commit-status-start
    runs-on: ubuntu-24.04
    outputs:
      go-changes: ${{ steps.go-changes.outputs.src }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.SHA || github.sha }}
          persist-credentials: false
      - name: Check code changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: go-changes
        with:
          base: ${{ inputs.base-SHA }}
          ref: ${{ inputs.SHA }}
          filters: |
            src:
              - .github/workflows/lint-codeql.yml
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'

  analyze:
    needs: check_changes
    if: ${{ always() && (needs.check_changes.outputs.go-changes == 'true' || !inputs.PR-number) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout repo
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ inputs.SHA || github.sha }}
        persist-credentials: false
        fetch-depth: 1
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # renovate: datasource=golang-version depName=go
        go-version: '1.26.6'
    - name: Initialize CodeQL
      uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
      with:
        languages: go
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2

  merge-upload-and-status:
    if: ${{ always() && inputs.PR-number }}
    name: Merge Upload and Status
    needs:
      - check_changes
      - analyze
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/common-post-jobs.yml
    with:
      context-ref: ${{ inputs.context-ref || github.sha }}
      sha: ${{ inputs.SHA || github.sha }}
      success: ${{ needs.check_changes.result == 'success' && (needs.analyze.result == 'success' || needs.analyze.result == 'skipped') }}
