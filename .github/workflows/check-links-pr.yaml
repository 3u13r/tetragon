name: Check docs links

on:
  workflow_dispatch:
    inputs:
      PR-number:
        required: true
        type: string
        description: "Pull request number."
      context-ref:
        required: true
        type: string
        description: "Context in which the workflow runs. If the pull request is from a fork, this is the pull request target branch. Otherwise, this is the pull request branch so committers can test workflow changes directly."
      SHA:
        required: true
        type: string
        description: "SHA under test (head of the pull request branch)."
      base-SHA:
        required: true
        type: string
        description: "SHA of the base branch (target branch of the pull request)."

jobs:
  commit-status-start:
    name: Commit Status Start
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Set initial commit status
        uses: cilium/tetragon/.github/actions/set-commit-status@main
        with:
          sha: ${{ inputs.SHA || github.sha }}

  links-checker:
    needs: commit-status-start
    runs-on: ubuntu-latest
    permissions: {} # lychee uses the GITHUB_TOKEN for authentication only
    env:
      PATCH_FILE: "additions.patch"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.SHA || github.sha }}
          fetch-depth: 0         # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.126.2'
          extended: true

      - name: Retrieve additions and replace GitHub main links with local branch
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base-SHA }}
          REPO: ${{ github.repository }}
          REVISION: ${{ inputs.SHA }}
        run: |
          git diff -U0 "$BASE_SHA" -- docs/content README.md | { grep ^\+[^+] || true; } > $PATCH_FILE

          sed -i "s#/cilium/tetragon/tree/main#/$REPO/tree/$REVISION#g" $PATCH_FILE
          sed -i "s#/cilium/tetragon/blob/main#/$REPO/blob/$REVISION#g" $PATCH_FILE
          sed -i "s#/cilium/tetragon/raw/main#/$REPO/raw/$REVISION#g" $PATCH_FILE
          sed -i "s#/cilium/tetragon/main#/$REPO/$REVISION#g" $PATCH_FILE

          cat $PATCH_FILE

      - name: Serve the Hugo website
        working-directory: docs
        run: hugo server &

      - name: Wait for server to be ready
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_seconds: 2
          max_attempts: 10
          retry_wait_seconds: 3
          command: |
            set -e
            curl -s http://localhost:1313 > /dev/null

      - name: Check new links
        id: lychee
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: --config .github/lychee.toml --base http://localhost:1313 $PATCH_FILE
          failIfEmpty: false # this can happen as we are checking diffs

  merge-upload-and-status:
    if: ${{ always() }}
    name: Merge Upload and Status
    needs: links-checker
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/common-post-jobs.yml
    with:
      context-ref: ${{ inputs.context-ref || github.sha }}
      sha: ${{ inputs.SHA || github.sha }}
      success: ${{ needs.links-checker.result == 'success' }}
