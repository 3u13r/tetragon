name: tetragon-rthooks test
on:
  workflow_call:
    inputs:
      PR-number:
        description: "Pull request number."
        required: true
        type: string
      context-ref:
        description: "Context in which the workflow runs. If the pull request is from a fork, this is the pull request target branch. Otherwise, this is the pull request branch so committers can test workflow changes directly."
        required: true
        type: string
      SHA:
        description: "SHA under test (head of the pull request branch)."
        required: true
        type: string
      base-SHA:
        description: "SHA of the base branch (target branch of the pull request)."
        required: false
        type: string
  workflow_dispatch:
    inputs:
      PR-number:
        description: "Pull request number."
        required: true
      context-ref:
        description: "Context in which the workflow runs. If the pull request is from a fork, this is the pull request target branch. Otherwise, this is the pull request branch so committers can test workflow changes directly."
        required: true
      SHA:
        description: "SHA under test (head of the pull request branch)."
        required: true
      base-SHA:
        description: "SHA of the base branch (target branch of the pull request)."
        required: false
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

jobs:
  commit-status-start:
    name: Commit Status Start
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Set initial commit status
        uses: cilium/tetragon/.github/actions/set-commit-status@main
        with:
          sha: ${{ inputs.SHA || github.sha }}
          context: tetragon-rthooks test

  prepare:
    needs: commit-status-start
    name: Build tetragon-rthooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      agentImage: ${{ steps.vars.outputs.agentImage }}
      operatorImage: ${{ steps.vars.outputs.operatorImage }}
      rthooksImage: ${{ steps.vars.outputs.rthooksImage }}
    concurrency:
      group: ${{ inputs.PR-number || github.ref }}-rthooks-build
      cancel-in-progress: true
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ inputs.SHA || github.sha }}
        path: go/src/github.com/cilium/tetragon/

    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # renovate: datasource=golang-version depName=go
        go-version: '1.26.6'

    - name: Set Up Job Variables
      id: vars
      env:
        SHA: ${{ inputs.SHA || github.sha }}
      run: |
        echo "agentImage=quay.io/cilium/tetragon-ci:${SHA}" >> $GITHUB_OUTPUT
        echo "operatorImage=quay.io/cilium/tetragon-operator-ci:${SHA}" >> $GITHUB_OUTPUT
        echo "rthooksImage=quay.io/cilium/tetragon-rthooks-ci:${SHA}" >> $GITHUB_OUTPUT

    - name: Wait Tetragon Images
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        timeout_minutes: 2
        max_attempts: 30
        retry_wait_seconds: 30
        warning_on_retry: false
        command: |
          set -e
          docker pull ${{ steps.vars.outputs.agentImage }}
          docker pull ${{ steps.vars.outputs.operatorImage }}
          docker pull ${{ steps.vars.outputs.rthooksImage }}
          docker rmi ${{ steps.vars.outputs.agentImage }} ${{ steps.vars.outputs.operatorImage }} ${{ steps.vars.outputs.rthooksImage }}

  test:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
        fail-fast: false
        matrix:
           cri:
            - "containerd"
            - "crio"
    concurrency:
      group: ${{ inputs.PR-number || github.ref }}-rthooks-test-${{ matrix.cri }}
      cancel-in-progress: true
    steps:
    - name: Checkout Code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ inputs.SHA || github.sha }}
        path: go/src/github.com/cilium/tetragon/

    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # renovate: datasource=golang-version depName=go
        go-version: '1.26.6'

    - name: Install kubectl
      uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      with:
        # renovate: datasource=github-releases depName=kubernetes/kubernetes
        version: v1.36.3

    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        # renovate: datasource=github-releases depName=helm/helm
        version: v4.2.4

    - name: Install Minikube
      uses: medyagh/setup-minikube@e9e035a86bbc3caea26a450bd4dbf9d0c453682e # v0.0.21
      with:
        start: false

    - name: Pull Tetragon Images
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        timeout_minutes: 2
        max_attempts: 30
        retry_wait_seconds: 30
        warning_on_retry: false
        command: |
          set -e
          docker pull ${{ needs.prepare.outputs.agentImage }}
          docker pull ${{ needs.prepare.outputs.operatorImage }}
          docker pull ${{ needs.prepare.outputs.rthooksImage }}


    - name: Run e2e Tests
      run: |
        cd go/src/github.com/cilium/tetragon
        make e2e-test-minikube E2E_BUILD_IMAGES=0 \
        MINIKUBE_CONTAINER_RUNTIME=${{ matrix.cri }} \
        E2E_AGENT=${{ needs.prepare.outputs.agentImage }} \
        E2E_OPERATOR=${{ needs.prepare.outputs.operatorImage }} \
        E2E_RTHOOKS=${{ needs.prepare.outputs.rthooksImage }} \
        EXTRA_TESTFLAGS="-args -v=4"


    - name: Upload Tetragon Logs
      if: failure() || cancelled()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: tetragon-logs-${{ matrix.cri }}
        path: /tmp/tetragon.e2e.*
        retention-days: 5

  merge-upload-and-status:
    name: Merge Upload and Status
    if: ${{ always() }}
    needs:
      - prepare
      - test
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/common-post-jobs.yml
    with:
      context-ref: ${{ inputs.context-ref || github.sha }}
      sha: ${{ inputs.SHA || github.sha }}
      success: ${{ needs.prepare.result == 'success' && needs.test.result == 'success' }}
      status-context: tetragon-rthooks test
