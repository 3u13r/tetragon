name: Lint helm chart
on:
  push:
    branches:
    - main
    - v*
    paths:
    - 'install/kubernetes/**'
    - 'pkg/k8s/apis/cilium.io/client/crds/v1alpha1/*.yaml'
    - 'docs/content/en/docs/reference/helm-chart.md'
    - '.github/workflows/lint-helm.yaml'
  workflow_dispatch:
    inputs:
      PR-number:
        description: "Pull request number."
        required: true
      context-ref:
        description: "Context in which the workflow runs. If the pull request is from a fork, this is the pull request target branch. Otherwise, this is the pull request branch so committers can test workflow changes directly."
        required: true
      SHA:
        description: "SHA under test (head of the pull request branch)."
        required: true
      base-SHA:
        description: "SHA of the base branch (target branch of the pull request)."
        required: false

permissions:
  contents: read

env:
  MIN_K8S_VERSION: "1.30.0"
  # renovate: datasource=python-version
  PYTHON_VERSION: "3.12"

jobs:
  commit-status-start:
    name: Commit Status Start
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Set initial commit status
        uses: cilium/tetragon/.github/actions/set-commit-status@main
        with:
          sha: ${{ inputs.SHA || github.sha }}

  build-and-lint-helm:
    needs: commit-status-start
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.SHA || github.sha }}
          fetch-depth: 0

      # Build Tetragon Helm chart
      - name: Check if Tetragon Helm chart is up to date
        run: |
          make -C install/kubernetes
          test -z "$(git status --porcelain)"
          if [ $? != 0 ]; then
            git status
            git diff
            echo "The Tetragon Helm chart is outdated."
            echo "Please run 'make -C install/kubernetes' and submit your changes."; exit 1
          fi

      # Validate Tetragon Helm chart
      - name: Check if openapi2jsonschema.py is up-to-date
        id: validate_openapi2jsonschema_script
        run: |
          make -C install/kubernetes openapi2jsonschema.py
          test -z "$(git status --porcelain)"
          if [ $? != 0 ]; then
            git status
            git diff
            echo "openapi2jsonschema.py seems to be outdated."
            echo "Please run 'make -C install/kubernetes openapi2jsonschema.py' and submit your changes."; exit 1
          fi
      - name: Run helm lint
        run: |
          set -ex
          make -C install/kubernetes lint
      - name: Check images tags exists
        run: make -C install/kubernetes check-images-tags
      - name: Run Kubeconform with minimum supported K8s version
        if: success() || steps.validate_openapi2jsonschema_script.outcome == 'failure'
        id: kubeconform_min_k8s_version
        uses: mathiasvr/command-output@34408ea3d0528273faff3d9e201761ae96106cd0 # v2.0.0
        with:
          shell: bash
          run: |
            make -C install/kubernetes kubeconform K8S_VERSION=${{ env.MIN_K8S_VERSION }}
      - name: Run Kubeconform with latest K8s version
        if: success() || steps.validate_openapi2jsonschema_script.outcome == 'failure'
        id: kubeconform_latest_k8s_version
        uses: mathiasvr/command-output@34408ea3d0528273faff3d9e201761ae96106cd0 # v2.0.0
        with:
          shell: bash
          run: |
            make -C install/kubernetes kubeconform

  merge-upload-and-status:
    if: ${{ always() }}
    name: Merge Upload and Status
    needs: build-and-lint-helm
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/common-post-jobs.yml
    with:
      context-ref: ${{ inputs.context-ref || github.sha }}
      sha: ${{ inputs.SHA || github.sha }}
      success: ${{ needs.build-and-lint-helm.result == 'success' }}